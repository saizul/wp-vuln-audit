name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          wp-vuln-audit --version
          wp-vuln-audit inventory examples/sample-site
          wp-vuln-audit scan examples/sample-site --feed-file examples/feed-sample.json --fail-on never
          wp-vuln-audit scan --wp-cli examples/wp-cli-site.json --feed-file examples/feed-sample.json \
            --format sarif --output smoke.sarif --fail-on never
          python -c "import json; assert json.load(open('smoke.sarif'))['version'] == '2.1.0'"
          # A vulnerable site must fail the build.
          if wp-vuln-audit scan examples/sample-site --feed-file examples/feed-sample.json --fail-on high; then
            echo "expected exit code 1" && exit 1
          fi
          python examples/library_usage.py
          # Known findings recorded in a baseline must not fail the build.
          wp-vuln-audit scan examples/sample-site --feed-file examples/feed-sample.json \
            --write-baseline smoke-baseline.json --fail-on never
          wp-vuln-audit scan examples/sample-site --feed-file examples/feed-sample.json \
            --baseline smoke-baseline.json --fail-on any

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wp-vuln-audit:ci .
      - run: >
          docker run --rm -v "$PWD/examples:/work" wp-vuln-audit:ci
          scan sample-site --feed-file feed-sample.json --fail-on never
